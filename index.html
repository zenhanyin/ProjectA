<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Life Capital / 人生资本</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Life Capital</p>
          <h1>人生资本</h1>
        </div>
        <nav class="tabs" aria-label="主导航">
          <button class="tab is-active" data-tab="dashboard" type="button">Dashboard</button>
          <button class="tab" data-tab="records" type="button">记录</button>
          <button class="tab" data-tab="settings" type="button">设置</button>
        </nav>
      </header>

      <main>
        <section class="view is-active" id="dashboard-view" aria-labelledby="dashboard-title">
          <div class="hero-panel">
            <div>
              <p class="label">今日已获得</p>
              <div class="live-amount" id="today-earned">¥0.00</div>
              <div class="rate-line">
                <span id="per-second">+¥0.0000 / 秒</span>
                <span id="work-status">等待工作时间</span>
              </div>
            </div>
            <div class="session-gain">
              <p class="label">本次打开以来</p>
              <strong id="session-earned">+¥0.00</strong>
            </div>
          </div>

          <div class="dashboard-grid">
            <section class="metric-band" aria-labelledby="dashboard-title">
              <h2 id="dashboard-title">资产状态</h2>
              <div class="net-worth" id="net-worth">¥0.00</div>
              <div class="asset-split">
                <span>资产 <strong id="total-assets">¥0.00</strong></span>
                <span>负债 <strong id="total-liabilities">¥0.00</strong></span>
              </div>
            </section>

            <section class="metric-band">
              <h2>今日反馈</h2>
              <div class="feedback-grid">
                <div>
                  <span>工作时间</span>
                  <strong id="worked-time">0分钟</strong>
                </div>
                <div>
                  <span>今日支出</span>
                  <strong id="today-spending">¥0.00</strong>
                </div>
                <div>
                  <span>今日保留</span>
                  <strong id="today-retained">¥0.00</strong>
                </div>
                <div>
                  <span>保留率</span>
                  <strong id="retention-rate">0%</strong>
                </div>
              </div>
            </section>
          </div>

          <section class="content-section">
            <div class="section-heading">
              <h2>储蓄目标</h2>
              <span id="goal-count">0 个目标</span>
            </div>
            <div class="goal-list" id="goal-list"></div>
          </section>

          <section class="content-section">
            <div class="section-heading">
              <h2>最近变化</h2>
              <span>收入、支出、调整与转移</span>
            </div>
            <div class="timeline" id="recent-activity"></div>
          </section>
        </section>

        <section class="view" id="records-view" aria-labelledby="records-title">
          <div class="two-column">
            <section class="content-section">
              <h2 id="records-title">添加流水</h2>
              <form id="transaction-form" class="form-grid">
                <label>
                  类型
                  <select name="type">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                    <option value="asset-adjustment">资产调整</option>
                  </select>
                </label>
                <label>
                  金额
                  <input name="amount" type="number" min="0" step="0.01" required placeholder="68">
                </label>
                <label>
                  账户
                  <select name="accountId" id="transaction-account"></select>
                </label>
                <label>
                  分类
                  <input name="category" type="text" placeholder="午餐 / 工资 / 调整">
                </label>
                <label class="span-2">
                  备注
                  <input name="note" type="text" placeholder="可选">
                </label>
                <button class="primary-action span-2" type="submit">记录变化</button>
              </form>
              <div class="feedback-card" id="transaction-feedback" hidden></div>
            </section>

            <section class="content-section">
              <h2>资产转移</h2>
              <form id="transfer-form" class="form-grid">
                <label>
                  转出账户
                  <select name="fromAccountId" id="transfer-from"></select>
                </label>
                <label>
                  转入账户
                  <select name="toAccountId" id="transfer-to"></select>
                </label>
                <label>
                  金额
                  <input name="amount" type="number" min="0" step="0.01" required placeholder="2000">
                </label>
                <label>
                  备注
                  <input name="note" type="text" placeholder="例如：转入投资账户">
                </label>
                <button class="secondary-action span-2" type="submit">记录转移</button>
              </form>
            </section>
          </div>

          <section class="content-section">
            <div class="section-heading">
              <h2>流水记录</h2>
              <span id="transaction-count">0 条</span>
            </div>
            <div class="transaction-list" id="transaction-list"></div>
          </section>
        </section>

        <section class="view" id="settings-view" aria-labelledby="settings-title">
          <div class="two-column">
            <section class="content-section">
              <h2 id="settings-title">收入与工作时间</h2>
              <form id="settings-form" class="form-grid">
                <label>
                  每月到手收入
                  <input name="monthlyIncome" type="number" min="0" step="0.01" required>
                </label>
                <label>
                  每月工作天数
                  <input name="workingDaysPerMonth" type="number" min="1" step="1" required>
                </label>
                <label>
                  每日工作小时
                  <input name="workingHoursPerDay" type="number" min="0.5" step="0.5" required>
                </label>
                <label>
                  工作开始时间
                  <input name="workStart" type="time" required>
                </label>
                <label>
                  工作结束时间
                  <input name="workEnd" type="time" required>
                </label>
                <button class="primary-action span-2" type="submit">保存设置</button>
              </form>
            </section>

            <section class="content-section">
              <h2>收入换算</h2>
              <div class="rate-grid">
                <div><span>日收入</span><strong id="daily-rate">¥0.00</strong></div>
                <div><span>小时收入</span><strong id="hourly-rate">¥0.00</strong></div>
                <div><span>分钟收入</span><strong id="minute-rate">¥0.00</strong></div>
                <div><span>每秒收入</span><strong id="second-rate">¥0.0000</strong></div>
              </div>
            </section>
          </div>

          <div class="two-column">
            <section class="content-section">
              <h2>资产账户</h2>
              <form id="account-form" class="form-grid">
                <label>
                  账户名称
                  <input name="name" type="text" required placeholder="银行卡">
                </label>
                <label>
                  类型
                  <select name="type">
                    <option value="现金">现金</option>
                    <option value="银行">银行</option>
                    <option value="储蓄">储蓄</option>
                    <option value="投资">投资</option>
                    <option value="其他">其他</option>
                  </select>
                </label>
                <label>
                  当前金额
                  <input name="balance" type="number" step="0.01" required placeholder="30000">
                </label>
                <button class="secondary-action" type="submit">添加账户</button>
              </form>
              <div class="compact-list" id="account-list"></div>
            </section>

            <section class="content-section">
              <h2>负债</h2>
              <form id="liability-form" class="form-grid">
                <label>
                  名称
                  <input name="name" type="text" required placeholder="房贷 / 信用卡">
                </label>
                <label>
                  当前金额
                  <input name="amount" type="number" min="0" step="0.01" required placeholder="120000">
                </label>
                <button class="secondary-action span-2" type="submit">添加负债</button>
              </form>
              <div class="compact-list" id="liability-list"></div>
            </section>
          </div>

          <section class="content-section">
            <h2>储蓄目标</h2>
            <form id="goal-form" class="form-grid goal-form">
              <label>
                目标名称
                <input name="name" type="text" required placeholder="独立游戏基金">
              </label>
              <label>
                目标金额
                <input name="targetAmount" type="number" min="1" step="0.01" required placeholder="100000">
              </label>
              <label>
                当前金额
                <input name="currentAmount" type="number" min="0" step="0.01" required placeholder="38620">
              </label>
              <button class="primary-action" type="submit">添加目标</button>
            </form>
            <div class="goal-settings-list" id="goal-settings-list"></div>
          </section>
        </section>
      </main>
    </div>

    <section class="onboarding" id="onboarding" aria-labelledby="onboarding-title" hidden>
      <div class="onboarding-panel">
        <p class="eyebrow">初始化</p>
        <h2 id="onboarding-title">建立你的现实财富经验值面板</h2>
        <form id="onboarding-form" class="form-grid">
          <label>
            每月到手收入
            <input name="monthlyIncome" type="number" min="0" step="0.01" required placeholder="17000">
          </label>
          <label>
            每月工作天数
            <input name="workingDaysPerMonth" type="number" min="1" step="1" required value="22">
          </label>
          <label>
            每日工作小时
            <input name="workingHoursPerDay" type="number" min="0.5" step="0.5" required value="8">
          </label>
          <label>
            工作开始时间
            <input name="workStart" type="time" required value="09:00">
          </label>
          <label>
            工作结束时间
            <input name="workEnd" type="time" required value="18:00">
          </label>
          <label>
            初始资产账户
            <input name="accountName" type="text" required placeholder="银行卡">
          </label>
          <label>
            账户类型
            <select name="accountType">
              <option value="银行">银行</option>
              <option value="现金">现金</option>
              <option value="储蓄">储蓄</option>
              <option value="投资">投资</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label>
            当前金额
            <input name="accountBalance" type="number" step="0.01" required placeholder="80000">
          </label>
          <label>
            负债金额
            <input name="liabilityAmount" type="number" min="0" step="0.01" value="0">
          </label>
          <button class="primary-action span-2" type="submit">进入 Dashboard</button>
        </form>
      </div>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/calculations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

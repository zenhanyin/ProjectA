<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Life Capital / 人生资本</title>
    <script>
      (function () {
        try {
          var data = JSON.parse(localStorage.getItem("lifeCapitalData") || "{}");
          var mode = data.displayMode || "focus";
          document.documentElement.dataset.mode = mode === "detail" ? "detail" : "focus";
        } catch (error) {
          document.documentElement.dataset.mode = "focus";
        }
      })();
    </script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">人生进度</p>
          <h1 id="app-title">今日开始</h1>
        </div>
        <div class="top-actions">
          <button class="mode-toggle" id="mode-toggle" type="button" aria-pressed="false">详细模式</button>
          <button class="quick-add" id="open-quick-record" type="button" aria-label="快速记录">+</button>
        </div>
      </header>

      <nav class="tabs" aria-label="主导航">
        <button class="tab is-active" data-tab="home" type="button">首页</button>
        <button class="tab" data-tab="history" type="button">历史</button>
        <button class="tab" data-tab="mine" type="button">我的</button>
      </nav>

      <main>
        <section class="view is-active" id="home-view" aria-labelledby="home-title">
          <h2 class="sr-only" id="home-title">首页</h2>
          <section id="focus-home" class="mode-view focus-only" aria-label="专注模式首页"></section>
          <section id="detail-home" class="mode-view detail-only" aria-label="详细模式首页"></section>
        </section>

        <section class="view" id="history-view" aria-labelledby="history-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">过去发生了什么</p>
              <h2 id="history-title">历史</h2>
            </div>
            <span id="history-count">0 条</span>
          </div>
          <div class="history-list" id="history-list"></div>
        </section>

        <section class="view" id="mine-view" aria-labelledby="mine-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">低频管理</p>
              <h2 id="mine-title">我的</h2>
            </div>
            <span id="mine-summary">同一套数据，两种解释</span>
          </div>

          <div class="two-column">
            <section class="panel sensitive-panel">
              <h3>工作与收入参数</h3>
              <form id="settings-form" class="form-grid">
                <label>每月到手收入<input name="monthlyIncome" type="number" min="0" step="0.01" required></label>
                <label>每月工作天数<input name="workingDaysPerMonth" type="number" min="1" step="1" required></label>
                <label>每日有效工作小时<input name="workingHoursPerDay" type="number" min="0.5" step="0.5" required></label>
                <label>工作开始时间<input name="workStart" type="time" required></label>
                <label>工作结束时间<input name="workEnd" type="time" required></label>
                <button class="primary-action span-2" type="submit">保存参数</button>
              </form>
              <div class="rate-grid" id="rate-grid"></div>
            </section>

            <section class="panel sensitive-panel">
              <h3>账户校准</h3>
              <form id="account-form" class="form-grid">
                <label>账户名称<input name="name" type="text" required placeholder="银行卡"></label>
                <label>类型<select name="type"><option value="现金">现金</option><option value="银行">银行</option><option value="储蓄">储蓄</option><option value="投资">投资</option><option value="其他">其他</option></select></label>
                <label>当前金额<input name="balance" type="number" step="0.01" required placeholder="30000"></label>
                <button class="secondary-action" type="submit">添加账户</button>
              </form>
              <div class="compact-list" id="account-list"></div>
            </section>
          </div>

          <div class="two-column">
            <section class="panel sensitive-panel">
              <h3>负债</h3>
              <form id="liability-form" class="form-grid">
                <label>名称<input name="name" type="text" required placeholder="房贷 / 信用卡"></label>
                <label>当前金额<input name="amount" type="number" min="0" step="0.01" required placeholder="120000"></label>
                <button class="secondary-action span-2" type="submit">添加负债</button>
              </form>
              <div class="compact-list" id="liability-list"></div>
            </section>

            <section class="panel sensitive-panel">
              <h3>长期阶段</h3>
              <form id="goal-form" class="form-grid">
                <label>阶段名称<input name="name" type="text" required placeholder="自由基金"></label>
                <label>阶段目标<input name="targetAmount" type="number" min="1" step="0.01" required placeholder="100000"></label>
                <label>当前进度<input name="currentAmount" type="number" min="0" step="0.01" required placeholder="38620"></label>
                <button class="primary-action" type="submit">添加阶段</button>
              </form>
              <div class="goal-settings-list" id="goal-settings-list"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <section class="quick-sheet" id="quick-sheet" hidden aria-labelledby="quick-title" role="dialog" aria-modal="true">
      <div class="quick-panel">
        <div class="section-heading">
          <div><p class="eyebrow">快速记录</p><h2 id="quick-title">发生了什么？</h2></div>
          <button class="icon-button" id="close-quick-record" type="button" aria-label="关闭">×</button>
        </div>
        <div class="record-types" role="tablist" aria-label="记录类型">
          <button class="record-type is-active" data-record-type="expense" type="button">支出</button>
          <button class="record-type" data-record-type="income" type="button">收入</button>
          <button class="record-type" data-record-type="adjustment" type="button">调整资产</button>
          <button class="record-type" data-record-type="transfer" type="button">账户转移</button>
        </div>
        <form id="quick-record-form" class="form-grid">
          <label class="record-amount">金额<input name="amount" type="number" min="0" step="0.01" required placeholder="68"></label>
          <label class="record-note">用途<input name="note" type="text" placeholder="午餐"></label>
          <label class="detail-field">账户<select name="accountId" id="quick-account"></select></label>
          <label class="transfer-field" hidden>转出<select name="fromAccountId" id="quick-transfer-from"></select></label>
          <label class="transfer-field" hidden>转入<select name="toAccountId" id="quick-transfer-to"></select></label>
          <button class="primary-action span-2" type="submit">完成</button>
        </form>
        <div class="meaning-feedback" id="meaning-feedback" hidden></div>
      </div>
    </section>

    <section class="onboarding" id="onboarding" aria-labelledby="onboarding-title" hidden>
      <div class="onboarding-panel">
        <p class="eyebrow">初始化</p>
        <h2 id="onboarding-title">建立你的现实人生进度系统</h2>
        <form id="onboarding-form" class="form-grid">
          <label>每月到手收入<input name="monthlyIncome" type="number" min="0" step="0.01" required placeholder="17000"></label>
          <label>每月工作天数<input name="workingDaysPerMonth" type="number" min="1" step="1" required value="22"></label>
          <label>每日有效工作小时<input name="workingHoursPerDay" type="number" min="0.5" step="0.5" required value="8"></label>
          <label>工作开始时间<input name="workStart" type="time" required value="09:00"></label>
          <label>工作结束时间<input name="workEnd" type="time" required value="18:00"></label>
          <label>初始账户<input name="accountName" type="text" required placeholder="银行卡"></label>
          <label>账户类型<select name="accountType"><option value="银行">银行</option><option value="现金">现金</option><option value="储蓄">储蓄</option><option value="投资">投资</option><option value="其他">其他</option></select></label>
          <label>当前金额<input name="accountBalance" type="number" step="0.01" required placeholder="80000"></label>
          <label>负债金额<input name="liabilityAmount" type="number" min="0" step="0.01" value="0"></label>
          <button class="primary-action span-2" type="submit">进入首页</button>
        </form>
      </div>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/calculations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
